version: "3.9"

services:
app:
build:
context: .
dockerfile: docker/Dockerfile
container_name: cashguard_app
restart: unless-stopped
working_dir: /var/www
volumes:
- ./:/var/www
ports:
- "8000:8000"
depends_on:
- db
- redis
networks:
- cashguard

db:
image: postgres:16-alpine
container_name: cashguard_db
restart: unless-stopped
environment:
POSTGRES_DB: cash_guard
POSTGRES_USER: sail
POSTGRES_PASSWORD: password
ports:
- "5432:5432"
volumes:
- dbdata:/var/lib/postgresql/data
networks:
- cashguard

redis:
image: redis:7-alpine
container_name: cashguard_redis
restart: unless-stopped
ports:
- "6379:6379"
networks:
- cashguard

networks:
cashguard:

volumes:
dbdata:
